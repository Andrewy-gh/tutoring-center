services:
  db:
    image: postgres:17.6
    container_name: tutoring-center-db
    environment:
      POSTGRES_DB: tutoring_center
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - tutoring-center-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tutoring_center']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  tutoring-center-postgres-data:
